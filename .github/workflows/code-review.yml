name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Claude Code Review
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          anthropic_federation_rule_id: fdrl_01QGh8a998rYqoSn8CNbJyrd
          anthropic_organization_id: svac_01WEEYs5yqMHhfMcgbuYHpbE
          anthropic_service_account_id: svac_01WEEYs5yqMHhfMcgbuYHpbE
          anthropic_workspace_id: wrkspc_01KoPSoEPaNHmypWbnw63hPg
          claude_args: "--model claude-sonnet-4-6"
