version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: "quarterly"
    cooldown:
      default-days: 5
    groups:
      composer:
        patterns:
          - "*"
      composer-security:
        applies-to: security-updates
        patterns:
          - "*"
